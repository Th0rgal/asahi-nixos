name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  evaluate:
    # Evaluation is architecture-independent: all three nixosConfigurations
    # must evaluate cleanly before anything builds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate all hosts
        run: |
          nix eval .#nixosConfigurations.m2air.config.system.build.toplevel.drvPath --raw
          nix eval .#nixosConfigurations.rehearsal.config.system.build.toplevel.drvPath --raw
          nix eval .#nixosConfigurations.vm.config.system.build.toplevel.drvPath --raw

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check formatting
        run: |
          nix fmt
          git diff --exit-code

  disko-declare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Validate disko destroy,format,mount dry-run and check
        run: |
          nix build .#checks.x86_64-linux.disko-declare -L
          nix run .#disko -- --mode destroy,format,mount --dry-run --flake .#m2air

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM access
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm
          fi
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            system-features = kvm nixos-test benchmark big-parallel
      - name: Run NixOS security VM checks
        run: nix build .#checks.x86_64-linux.security -L

  installer-iso:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            auto-optimise-store = true
            substituters = https://nixos-apple-silicon.cachix.org https://cache.nixos.org
            trusted-public-keys = nixos-apple-silicon.cachix.org-1:8psDu5SA5dAD7qA0zMy5UT292TxeEPzIz8VVEr2Js20= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Prepare and build Asahi kernel
        run: |
          nix build .#installer-bootstrap.config.system.build.kernel.src -j1 -L -o kernel-src
          nix build .#installer-bootstrap.config.system.build.kernel.configfile -j1 -L
          nix build .#installer-bootstrap.config.system.build.kernel -j1 -L -o kernel
          KERNEL_SRC=$(readlink -f kernel-src)
          rm -f kernel-src
          nix-store --delete "$KERNEL_SRC" || true
      - name: Build installer ISO
        run: nix build .#installer-bootstrap -j2 -L --out-link iso
      - uses: actions/upload-artifact@v4
        with:
          name: installer-iso
          path: iso/iso/*.iso
